name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    name: "Ruby ${{ matrix.ruby }} - Rails ${{ matrix.rails }}"

    services:
      redis:
        image: redis:8.10
        ports:
          - 6379:6379

    continue-on-error: ${{ matrix.ruby == 'head' }}

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0", "head"]
        rails: ["8.0", "8.1"]

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}.gemfile

    steps:
      - uses: actions/checkout@v7

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: client-app
        run: node scripts/ensure-dependencies.mjs

      - name: Build JS app
        run: bash build_client_app.sh

      - name: Tests (no Rails)
        run: bundle exec rake test

      - name: Tests (Railtie)
        run: bundle exec rake test TEST=test/logster/test_railtie.rb

  rack:
    runs-on: ubuntu-latest

    name: "Ruby ${{ matrix.ruby }} - Rack ${{ matrix.rack }}"

    services:
      redis:
        image: redis:8.10
        ports:
          - 6379:6379

    continue-on-error: ${{ matrix.ruby == 'head' }}

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        rack: ["3.1", "3.2"]
        include:
          - ruby: "head"
            rack: "3.2"

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rack_${{ matrix.rack }}.gemfile

    steps:
      - uses: actions/checkout@v7

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: client-app
        run: node scripts/ensure-dependencies.mjs

      - name: Build JS app
        run: bash build_client_app.sh

      - name: Tests
        run: bundle exec rake test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: client-app
        run: node scripts/ensure-dependencies.mjs

      - name: JS tests
        working-directory: client-app
        run: |
          npm run test:build-scripts
          npm run test:ember

  linting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Ruby lint
        run: bundle exec rubocop

      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client-app/package-lock.json

      - name: Install frontend dependencies
        if: ${{ !cancelled() }}
        working-directory: client-app
        run: node scripts/ensure-dependencies.mjs

      - name: Syntax Tree
        if: ${{ !cancelled() }}
        run: |
          bundle exec stree check Gemfile $(git ls-files '*.rb') $(git ls-files '*.rake') $(git ls-files '*.thor')

      - name: JS linting
        if: ${{ !cancelled() }}
        working-directory: client-app
        run: npm run lint

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, rack, frontend, linting]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: client-app
        run: node scripts/ensure-dependencies.mjs

      - name: Build JS app
        run: bash build_client_app.sh

      - name: Release Gem
        uses: discourse/publish-rubygems-action@v3
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
          GIT_EMAIL: team@discourse.org
          GIT_NAME: discoursebot
